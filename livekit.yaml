# LiveKit Server Configuration
# https://docs.livekit.io/home/server/config

port: 7880
rtc:
  tcp_port: 7882
  port_range_begin: 50000
  port_range_end: 60000
  use_external_ip: true

turn:
  enabled: true
  domain: screen-share.local
  tls_port: 5349
  port: 3478
  users:
    - username: "turnuser"
      password: "turnpass"
      ttl: 86400

keys:
  devkey: "supersecretdevkey123"

room:
  max_participants: 50
  empty_timeout: 300
  departure_timeout: 60

recording:
  enabled: false

egress:
  enabled: false

logging:
  level: info
  json: false