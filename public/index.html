<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screen Share — Sala Colaborativa</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ====== LOGIN SCREEN ====== -->
  <div id="login-screen" class="screen active">
    <div class="login-card">
      <h1>🖥️ Screen Share</h1>
      <p class="subtitle">Compartilhe sua tela com seus amigos</p>

      <!-- Avatar upload -->
      <label class="avatar-upload" id="avatar-label">
        <input type="file" id="avatar-input" accept="image/*" hidden />
        <img id="avatar-preview" src="" alt="Avatar" />
        <div class="avatar-overlay">📷</div>
      </label>
      <span class="avatar-hint">Clique para escolher uma foto</span>

      <input type="text" id="nickname-input" placeholder="Seu nickname" maxlength="24" autocomplete="off" />
      <input type="password" id="password-input" placeholder="Senha da sala" autocomplete="off" />
      <button id="join-btn">Entrar na Sala</button>
      <p id="login-error" class="error-msg"></p>
    </div>
  </div>

  <!-- ====== ROOM SCREEN ====== -->
  <div id="room-screen" class="screen">

    <!-- Top bar -->
    <header id="topbar">
      <div class="topbar-left">
        <span class="logo">🖥️ Screen Share</span>
        <span id="participant-count" class="badge">0 online</span>
      </div>
      <div class="topbar-right">
        <div class="quality-control" id="quality-control" title="Qualidade da Transmissão">
          <label for="quality-select" class="quality-label">🎬</label>
          <select id="quality-select" class="quality-select">
            <option value="1080p60">1080p 60 FPS — Alto Upload / Alta Qualidade</option>
            <option value="1080p30">1080p 30 FPS — Upload Médio</option>
            <option value="720p60" selected>720p 60 FPS — Recomendado p/ Jogos (Upload Moderado)</option>
            <option value="720p30">720p 30 FPS — Conexões Estáveis</option>
            <option value="480p60">480p 60 FPS — Redes Oscilantes/Lentas</option>
            <option value="480p30">480p 30 FPS — Consumo Mínimo</option>
          </select>
        </div>
        <button id="btn-share" class="btn-action btn-green" title="Compartilhar Tela">
          <span class="btn-icon">📺</span> Compartilhar Tela
        </button>
        <button id="btn-stop" class="btn-action btn-red hidden" title="Parar Compartilhamento">
          <span class="btn-icon">⏹️</span> Parar
        </button>
        <button id="btn-toggle-sidebar" class="btn-action btn-neutral" title="Participantes">
          <span class="btn-icon">👥</span>
        </button>
      </div>
    </header>

    <main id="main-content">

      <!-- Video grid -->
      <div id="video-grid">
        <div id="empty-state" class="empty-state">
          <div class="empty-icon">📡</div>
          <p>Ninguém está compartilhando a tela ainda.</p>
          <p class="small">Clique em <strong>"Compartilhar Tela"</strong> para começar!</p>
        </div>
      </div>

      <!-- Participants sidebar -->
      <aside id="sidebar" class="sidebar">
        <h3>Participantes</h3>
        <ul id="participants-list"></ul>
      </aside>

    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
