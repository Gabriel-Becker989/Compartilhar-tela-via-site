<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screen Share — LiveKit Cloud</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>
<body>

  <!-- ====== LOGIN / JOIN SCREEN ====== -->
  <div id="login-screen" class="screen active">
    <div class="login-card">
      <div class="header-title">
        <span class="icon">🖥️</span>
        <h1>Screen Share</h1>
        <span class="badge-livekit">LiveKit</span>
      </div>
      <p class="subtitle">Compartilhe sua tela via LiveKit Cloud</p>

      <!-- Upload do Avatar com Ícone de Tubarão -->
      <div class="avatar-upload">
        <label for="avatar-input" class="avatar-label">
          <img id="avatar-preview" src="data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%20fill='%235865f2'%3E%3Crect%20width='100'%20height='100'%20fill='%235865f2'%3E%3Ctext%20x='50'%20y='65'%20text-anchor='middle'%20fill='white'%20font-size='50'%20font-family='sans-serif'%3E🦈%3C/text%3E%3C/svg%3E" alt="Avatar" />
        </label>
        <input type="file" id="avatar-input" accept="image/*" hidden />
        <span class="avatar-hint">Clique para trocar foto</span>
      </div>

      <input type="text" id="name-input" placeholder="Seu nome do usuário" autocomplete="off" />
      <input type="password" id="password-input" placeholder="Senha da sala" value="ovo" autocomplete="off" />

      <button id="join-btn">Entrar na Sala</button>
      <p id="login-error" class="error-msg"></p>
    </div>
  </div>

  <!-- ====== ROOM SCREEN ====== -->
  <div id="room-screen" class="screen">
    <header id="topbar">
      <div class="topbar-left">
        <span class="logo">🖥️ Screen Share</span>
        <span id="room-name-badge" class="badge">sala-principal</span>
        <span id="participant-count" class="badge">0 online</span>
      </div>
      <div class="topbar-right">
        <button id="btn-share" class="btn-action btn-green" title="Compartilhar Tela">
          <span class="btn-icon">📺</span> Compartilhar Tela
        </button>
        <button id="btn-stop" class="btn-action btn-red hidden" title="Parar Compartilhamento">
          <span class="btn-icon">⏹️</span> Parar
        </button>
        <button id="btn-leave" class="btn-action btn-neutral" title="Sair da Sala">
          <span class="btn-icon">🚪</span> Sair
        </button>
      </div>
    </header>

    <main id="main-content">
      <div id="video-grid">
        <div id="empty-state" class="empty-state">
          <div class="empty-icon">📡</div>
          <p>Ninguém está compartilhando a tela ainda.</p>
          <p class="small">Clique em <strong>"Compartilhar Tela"</strong> para começar!</p>
        </div>
        <video id="remoteVideo" autoplay playsinline muted class="hidden"></video>
      </div>

      <aside id="sidebar" class="sidebar">
        <h3>Participantes</h3>
        <ul id="participants-list"></ul>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
